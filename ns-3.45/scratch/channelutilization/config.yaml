# ns-3 無線LANチャネル使用率シミュレーション 設定ファイル

# 総ユーザ数
nStations: 1

# 重ユーザ割合(%) ※nHeavyUsers/nStations * 100 と一致させる
heavyUserPercentage: 100

# 実行環境の配置半径(m)
radius: 5.0

# 出力CSVファイル名
outputFile: "cu_RvsU_1clients.csv"

# 重ユーザのデータレート(Mbps)
heavyUserRate: 5

# 軽ユーザのデータレート(Mbps)
lightUserRate: 2

# パケットサイズ(バイト)
packetSize: 1500

# シミュレーション時間(秒)
simulationTime: 10.0

# TXT形式の詳細結果出力を有効化
enableTxtOutput: true

# NetAnimトレース生成を有効化
enableNetAnim: false

# 詳細ログ出力
verbose: false